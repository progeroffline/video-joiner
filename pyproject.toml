[project]
name = "video-joiner"
version = "0.1.0"
description = "CLI-утилита для объединения частей с копированием видео без перекодирования через FFmpeg."
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
    "loguru>=0.7",
]

[project.scripts]
video-joiner = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py"]
